<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CruciBetel</title>
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="scripts/main.js"></script>
  </head>

  <body>
    <header>
      <h1>CruciBetel</h1>
    </header>

    <div class="timer-card">
      <span class="timer-label">Tempo</span>
      <div class="timer-value" id="timer">00:00</div>
    </div>

    <main class="game-container">
      <section class="grid-container">
        <div class="crossword-grid" id="crosswordGrid"></div>
      </section>

      <aside
        class="dashboard"
        id="dashboardId"
        aria-label="Statistiche di gioco"
      >
        <section
          class="current-clue-container"
          aria-label="Definizione corrente"
        >
          <div class="clue-box">
            <h2 class="clue-title">Definizione</h2>
            <p class="clue-text" id="current-clue"></p>
          </div>
        </section>
      </aside>
    </main>
  </body>
  ˚
</html>

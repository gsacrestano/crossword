<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Cruciverba</title>
    <link rel="stylesheet" href="./style.css">
     <script src="./scripts/game-logic.js"></script>
    <script src="./scripts/broadcast-communication.js"></script>
    <style>

    </style>
</head>

<body>

    <header>
        <h1>Regia Cruciverba</h1>
    </header>


    <section class="dashboard" aria-label="Statistiche di gioco">
        <div class="stat-box">
            <span class="stat-label">Tempo</span>
            <div class="stat-value" id="timer">00:00</div>
        </div>
        <div class="stat-box">
            <span class="stat-label">Punti Squadra 1</span>
            <div class="stat-value" id="scoreTeam1">0</div>
        </div>
        <div class="stat-box">
            <span class="stat-label">Punti Squadra 2</span>
            <div class="stat-value" id="scoreTeam2">0</div>
        </div>
    </section>

    <main class="controls-panel">

        <div class="control-section">
            <h2>Assegnazione Punti</h2>
            <div class="button-group">
                <button class="btn" data-action="add-point-team1" onclick="handleEvent(event)">+1 Punti Squadra 1</button>
                <button class="btn" data-action="add-point-team2" onclick="handleEvent(event)">+1 Punti Squadra 2</button>
            </div>
        </div>

        <div class="control-section">
            <h2>Meccaniche di Gioco</h2>
            <div class="button-group">
                <button class="btn btn-primary" data-action="start-timer" onclick="handleEvent(event)">Fai partire il timer</button>
                <button class="btn" data-action="stop-timer" onclick="handleEvent(event)">Pausa Timer</button>
                <button class="btn" data-action="show-word" onclick="handleEvent(event)">Mostra Parola</button>
            </div>
        </div>

        <div class="control-section">
            <h2>Soundbar Effetti</h2>
            <div class="button-group">
                <button class="btn btn-sound" data-sound="correct">✅ Risposta Corretta</button>
                <button class="btn btn-sound" data-sound="wrong">❌ Errore</button>
                <button class="btn btn-sound" data-sound="countdown">⏱️ Ultimi Secondi</button>
                <button class="btn btn-sound" data-sound="victory">🎉 Vittoria dello Schema</button>
            </div>
        </div>

    </main>

    <section class="grid-container">
        <div class="crossword-grid" id="crosswordGrid">
        </div>
    </section>

    <div class="sync-indicator" id="syncStatus">
        <span class="status-dot"></span>
        <span id="syncText">Regia attiva (BroadcastChannel pronto)</span>
    </div>

</body>

</html>

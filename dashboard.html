<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Cruciverba</title>
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="scripts/main.js"></script>
    <style></style>
  </head>

  <body>
    <header>
      <h1>Regia Cruciverba</h1>
    </header>

    <main class="regia-layout">
      <section class="controls-wrapper" aria-label="Pannello dei comandi">
        <div class="control-section">
          <h2>Gestione Squadre</h2>
          <br />
          <div class="button-group" id="stats-control-section"></div>
        </div>

        <div class="control-section">
          <h2>Meccaniche di Gioco</h2>
          <br />
          <div class="button-group">
            <button class="btn btn-primary" data-action="start-timer">
              Fai partire il timer
            </button>
            <button class="btn" data-action="stop-timer">Pausa Timer</button>
            <button class="btn" data-action="show-word">Mostra Parola</button>
          </div>
        </div>

        <div class="control-section">
          <h2>Soundbar Effetti</h2>
          <div class="button-group">
            <button class="btn btn-sound" data-sound="correct">
              ✅ Risposta Corretta
            </button>
            <button class="btn btn-sound" data-sound="wrong">❌ Errore</button>
            <button class="btn btn-sound" data-sound="victory">
              🎉 Vittoria dello Schema
            </button>
          </div>
        </div>
        <section
          class="current-clue-container"
          aria-label="Definizione corrente"
        >
          <div class="clue-box">
            <h2 class="clue-title">Definizione</h2>
            <p class="clue-text" id="current-clue"></p>
          </div>
        </section>
      </section>

      <aside
        class="dashboard"
        id="dashboardId"
        aria-label="Statistiche di gioco"
      >
        <div class="timer-card">
          <span class="timer-label">Tempo</span>
          <div class="timer-value" id="timer">00:00</div>
        </div>
      </aside>
    </main>

    <br />
    <section class="grid-container">
      <div class="crossword-grid" id="crosswordGrid"></div>
    </section>
  </body>
</html>
